<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BetweenYears — Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --cream: #F5F0E8;
            --warm-white: #FAF8F4;
            --sage: #8A9E85;
            --deep-sage: #4A6741;
            --terracotta: #C97B5A;
            --charcoal: #2C2C2C;
            --mid-gray: #6B6B6B;
            --light-gray: #D8D3CA;
            --font-display: 'Playfair Display', Georgia, serif;
            --font-body: 'DM Sans', sans-serif;
            --transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-premium: 0 20px 50px rgba(74, 103, 65, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background: var(--warm-white);
            color: var(--charcoal);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(138, 158, 133, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(201, 123, 90, 0.05) 0%, transparent 40%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 2rem;
            z-index: 10;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 32px;
            padding: 3rem 2.5rem;
            box-shadow: var(--shadow-premium);
            position: relative;
            transition: var(--transition);
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            color: var(--deep-sage);
            text-decoration: none;
            display: block;
            text-align: center;
            margin-bottom: 2.5rem;
            letter-spacing: -0.02em;
        }

        .logo span { color: var(--terracotta); font-style: italic; }

        .auth-header { text-align: center; margin-bottom: 2.5rem; }
        .auth-header h1 { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--charcoal); }
        .auth-header p { color: var(--mid-gray); font-size: 0.95rem; font-weight: 300; }

        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-label { display: block; font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--mid-gray); margin-bottom: 0.6rem; margin-left: 4px; }
        
        .form-input {
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 16px;
            border: 1px solid var(--light-gray);
            background: rgba(255, 255, 255, 0.5);
            font-family: var(--font-body);
            font-size: 0.95rem;
            color: var(--charcoal);
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--sage);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(138, 158, 133, 0.1);
        }

        .btn {
            width: 100%;
            padding: 1rem;
            border-radius: 100px;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .btn-primary {
            background: var(--deep-sage);
            color: #fff;
            box-shadow: 0 4px 15px rgba(74, 103, 65, 0.2);
            margin-top: 1rem;
        }

        .btn-primary:hover {
            background: var(--terracotta);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(201, 123, 90, 0.3);
        }

        .btn-guest {
            background: transparent;
            color: var(--mid-gray);
            border: 1px solid var(--light-gray);
            margin-top: 0.8rem;
        }

        .btn-guest:hover {
            border-color: var(--deep-sage);
            color: var(--deep-sage);
            background: rgba(138, 158, 133, 0.05);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--mid-gray);
        }

        .auth-footer a {
            color: var(--deep-sage);
            text-decoration: none;
            font-weight: 500;
            transition: var(--transition);
        }

        .auth-footer a:hover { color: var(--terracotta); }

        /* Animation States */
        #signup-fields { display: none; margin-bottom: 0; }
        .is-signup #signup-fields { display: block; animation: slideDown 0.4s ease; }
        .is-signup #login-btn { display: none; }
        .is-signup #signup-btn { display: flex; }
        #signup-btn { display: none; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Notifications */
        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            background: #fff;
            box-shadow: var(--shadow-premium);
            border-left: 4px solid var(--sage);
            display: flex;
            align-items: center;
            gap: 0.8rem;
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1000;
        }
        .toast.show { transform: translateX(0); }
        .toast.error { border-left-color: #e74c3c; }
        .toast-msg { font-size: 0.9rem; color: var(--charcoal); }

        .loader {
            width: 18px; height: 18px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
            display: none;
        }
        .btn.loading .loader { display: block; }
        .btn.loading span { display: none; }

        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 480px) {
            .container { padding: 1rem; }
            .auth-card { padding: 2.5rem 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <a href="betweenyears.html" class="logo">Between<span>Years</span></a>

        <div class="auth-card" id="auth-card">
            <div class="auth-header">
                <h1 id="auth-title">Welcome Back</h1>
                <p id="auth-subtitle">Continue your journey of reflection.</p>
            </div>

            <form id="auth-form">
                <div id="signup-fields">
                    <div class="form-group">
                        <label class="form-label" for="name">Display Name</label>
                        <input type="text" id="name" class="form-input" placeholder="Alex Chen">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input type="email" id="email" class="form-input" placeholder="alex@example.com" required>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required>
                </div>

                <button type="submit" id="login-btn" class="btn btn-primary">
                    <div class="loader"></div>
                    <span>Sign In</span>
                </button>

                <button type="submit" id="signup-btn" class="btn btn-primary">
                    <div class="loader"></div>
                    <span>Create Account</span>
                </button>

                <button type="button" id="guest-btn" class="btn btn-guest">
                    <span>Continue as Guest</span>
                </button>
            </form>

            <div class="auth-footer">
                <p id="toggle-text">Don't have an account? <a href="#" id="toggle-auth">Sign Up</a></p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">
        <span id="toast-icon">✨</span>
        <span id="toast-msg" class="toast-msg">Success! Redirecting...</span>
    </div>

    <script src="login.js"></script>
</body>
</html>
